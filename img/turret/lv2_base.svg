<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320" role="img" aria-label="藍金冰晶砲台固定底座">
  <defs>
    <linearGradient id="hull" x1="0" y1="0" x2="0.75" y2="1">
      <stop offset="0" stop-color="#48B9E9"/>
      <stop offset="0.48" stop-color="#1274B9"/>
      <stop offset="1" stop-color="#15437C"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0.12" y2="1">
      <stop offset="0" stop-color="#FFEFA5"/>
      <stop offset="0.48" stop-color="#FFCA50"/>
      <stop offset="1" stop-color="#D58A27"/>
    </linearGradient>
    <linearGradient id="ice" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#E5FFFF"/>
      <stop offset="0.55" stop-color="#83DFF7"/>
      <stop offset="1" stop-color="#2C9AC9"/>
    </linearGradient>
  </defs>

  <!-- A simple symmetric, low-perspective pedestal for clean sprite animation. -->
  <ellipse cx="160" cy="294" rx="126" ry="16" fill="#0D315A" opacity="0.20"/>
  <path d="M49 268 70 245 101 249 119 226 143 241 167 228 189 243 218 224 236 248 267 247 288 270 274 288 49 288Z"
        fill="url(#ice)" stroke="#1C6196" stroke-width="5" stroke-linejoin="round"/>
  <path d="M54 270 82 265 95 251 119 254 139 242 161 256 188 246 213 257 235 249 260 263 282 267"
        fill="none" stroke="#F2FFFF" stroke-width="7" stroke-linejoin="round" opacity="0.88"/>
  <path d="M71 278 100 264 119 280 145 259 165 284 198 262 218 278 253 262"
        fill="none" stroke="#D5F9FF" stroke-width="3" opacity="0.8"/>

  <!-- Wide body, intentionally flat and readable at 100px in game. -->
  <path d="M70 221 Q75 202 99 199 H221 Q245 202 250 221 L263 260 Q264 279 247 282 H73 Q56 279 57 260Z"
        fill="#083562" stroke="#082746" stroke-width="8" stroke-linejoin="round"/>
  <path d="M73 220 Q77 210 100 208 H220 Q243 210 247 220 L253 261 Q251 271 244 273 H76 Q66 271 66 261Z"
        fill="url(#hull)" stroke="#7FDDFC" stroke-width="3" stroke-linejoin="round"/>

  <!-- Back rim acts as a visual docking cradle, but doesn't rotate. -->
  <path d="M87 216 Q91 187 122 178 Q160 164 198 178 Q229 187 233 216"
        fill="#073D75" stroke="#072948" stroke-width="8" stroke-linecap="round"/>
  <path d="M88 211 Q96 181 126 174 Q160 164 194 174 Q224 181 232 211"
        fill="none" stroke="url(#gold)" stroke-width="9" stroke-linecap="round"/>

  <!-- Gold framing and flat colored armor planes. -->
  <path d="M72 224 99 235 99 267 73 262Z" fill="#07517E" stroke="#0A3761" stroke-width="3"/>
  <path d="M248 224 221 235 221 267 247 262Z" fill="#07517E" stroke="#0A3761" stroke-width="3"/>
  <path d="M98 226 H222 L214 267 H106Z" fill="#0A5795" stroke="#064273" stroke-width="4"/>
  <path d="M91 233 112 224 H208 L229 233" fill="none" stroke="url(#gold)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M78 268 H242" fill="none" stroke="url(#gold)" stroke-width="8" stroke-linecap="round"/>
  <path d="M91 274 H229" fill="none" stroke="#FFE8A5" stroke-width="2" stroke-linecap="round"/>

  <!-- Static armored shoulders. -->
  <path d="M62 221 82 208 103 216 101 259 83 272 65 260Z" fill="#0B5794" stroke="#083B68" stroke-width="6" stroke-linejoin="round"/>
  <path d="M258 221 238 208 217 216 219 259 237 272 255 260Z" fill="#0B5794" stroke="#083B68" stroke-width="6" stroke-linejoin="round"/>
  <path d="M70 223 81 215 95 221" fill="none" stroke="url(#gold)" stroke-width="6" stroke-linecap="round"/>
  <path d="M250 223 239 215 225 221" fill="none" stroke="url(#gold)" stroke-width="6" stroke-linecap="round"/>
  <path d="M69 255 83 264 100 255M251 255 237 264 220 255" fill="none" stroke="#F9C04C" stroke-width="5" stroke-linejoin="round"/>

  <!-- Royal ice emblem, visible beneath the rotating axle. -->
  <path d="M160 246 179 257 172 277 H148 L141 257Z" fill="url(#gold)" stroke="#693B17" stroke-width="3"/>
  <path d="M160 251 173 259 167 272 H153 L147 259Z" fill="#1EAAD9" stroke="#F8F1B0" stroke-width="2"/>
  <path d="M160 254 V270 M152 262 H168" stroke="#EBFFFF" stroke-width="2.5" stroke-linecap="round"/>

  <circle cx="83" cy="244" r="5" fill="#FFE8A3" stroke="#8B5D25" stroke-width="2"/>
  <circle cx="237" cy="244" r="5" fill="#FFE8A3" stroke="#8B5D25" stroke-width="2"/>
  <path d="M104 215 H126M194 215 H216" stroke="#D2F7FF" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
</svg>
