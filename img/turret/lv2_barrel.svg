<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320" role="img" aria-label="藍金冰晶砲台可旋轉砲管，中心點160,213">
  <defs>
    <linearGradient id="tube" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#083F72"/>
      <stop offset="0.25" stop-color="#278BD1"/>
      <stop offset="0.62" stop-color="#1376BA"/>
      <stop offset="1" stop-color="#092F59"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF0A3"/>
      <stop offset="0.54" stop-color="#F7BC44"/>
      <stop offset="1" stop-color="#D5841E"/>
    </linearGradient>
  </defs>
  <!-- All artwork uses the same 320×320 coordinate system as the base. -->
  <!-- Aim straight up at zero degrees; rotate around (160, 213) only. -->
  <path d="M142 197 134 166 140 94 Q140 84 151 80 H169 Q180 84 180 94 L186 166 178 197Z"
        fill="url(#tube)" stroke="#082D54" stroke-width="7" stroke-linejoin="round"/>
  <path d="M149 105 149 176" stroke="#69D9F9" stroke-width="8" stroke-linecap="round"/>
  <path d="M175 104 177 170" stroke="#075B9E" stroke-width="7" stroke-linecap="round"/>
  <path d="M139 137 H181 L184 154 H136Z" fill="url(#metal)" stroke="#8B4B1D" stroke-width="4" stroke-linejoin="round"/>
  <path d="M142 142 H178" stroke="#FFF3BC" stroke-width="3" stroke-linecap="round"/>

  <!-- Flat heroic muzzle, with a clean outline and bright cyan bore. -->
  <path d="M132 77 134 60 Q134 55 141 54 H179 Q186 55 186 60 L188 77 181 91 H139Z"
        fill="url(#metal)" stroke="#693817" stroke-width="6" stroke-linejoin="round"/>
  <path d="M140 65 Q160 58 180 65 L180 80 Q160 90 140 80Z"
        fill="#0A3867" stroke="#09253F" stroke-width="4"/>
  <ellipse cx="160" cy="68" rx="15" ry="6.5" fill="#0B92C7" stroke="#7DECFF" stroke-width="3"/>
  <ellipse cx="160" cy="68" rx="6" ry="3" fill="#E8FFFF"/>
  <path d="M134 77 H186" fill="none" stroke="#FFEA9C" stroke-width="5" stroke-linecap="round"/>

  <!-- Small lateral braces that rotate as one connected barrel unit. -->
  <path d="M139 169 122 183 124 198 143 203Z" fill="#F7B544" stroke="#78461E" stroke-width="4" stroke-linejoin="round"/>
  <path d="M181 169 198 183 196 198 177 203Z" fill="#F7B544" stroke="#78461E" stroke-width="4" stroke-linejoin="round"/>
  <path d="M147 175 H173 L179 206 H141Z" fill="#155F9E" stroke="#062F57" stroke-width="5"/>

  <!-- PIVOT: the precise center of the decorative axle is (160, 213). -->
  <circle cx="160" cy="213" r="29" fill="#082E55" stroke="#0C2749" stroke-width="6"/>
  <circle cx="160" cy="213" r="24" fill="url(#metal)" stroke="#6F441E" stroke-width="3"/>
  <circle cx="160" cy="213" r="16" fill="#116EAF" stroke="#08375D" stroke-width="4"/>
  <circle cx="160" cy="213" r="9" fill="#47C9ED" stroke="#C2F8FF" stroke-width="2"/>
  <path d="M157 208 161 205 164 209" fill="none" stroke="#E7FFFF" stroke-width="2" stroke-linecap="round"/>
  <circle cx="160" cy="191" r="2.5" fill="#FFF7C9"/>
  <circle cx="160" cy="235" r="2.5" fill="#FFF7C9"/>
  <circle cx="138" cy="213" r="2.5" fill="#FFF7C9"/>
  <circle cx="182" cy="213" r="2.5" fill="#FFF7C9"/>
</svg>
