<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320" role="img" aria-label="LV3 黃金極光機關砲可旋轉三連砲管，中心160,213">
  <defs>
    <linearGradient id="gold" x1="0" x2=".1" y1="0" y2="1">
      <stop offset="0" stop-color="#FFF2A5"/>
      <stop offset=".46" stop-color="#FFC54A"/>
      <stop offset="1" stop-color="#C78321"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#0A3567"/>
      <stop offset=".48" stop-color="#338DD7"/>
      <stop offset="1" stop-color="#0B3C79"/>
    </linearGradient>
  </defs>
  <!-- Mechanically linked triple barrels: one CSS/SVG rotation controls all. -->
  <path d="M119 163 122 89 142 83 145 163Z" fill="url(#blue)" stroke="#092B56" stroke-width="6"/>
  <path d="M175 163 178 89 198 83 201 163Z" fill="url(#blue)" stroke="#092B56" stroke-width="6"/>
  <path d="M145 184 140 80 151 75 H169 L180 80 175 184Z" fill="url(#blue)" stroke="#082B56" stroke-width="7" stroke-linejoin="round"/>
  <path d="M131 101 128 152 M189 101 192 152 M154 91 154 157"
        stroke="#67E4FF" stroke-width="5" stroke-linecap="round" opacity=".95"/>

  <!-- Three distinct muzzle ports show increased fire rate. -->
  <path d="M116 80 116 65 142 65 145 81 140 96 H121Z" fill="url(#gold)" stroke="#71411C" stroke-width="4" stroke-linejoin="round"/>
  <path d="M175 80 178 65 204 65 204 80 199 96 H180Z" fill="url(#gold)" stroke="#71411C" stroke-width="4" stroke-linejoin="round"/>
  <path d="M138 73 141 54 H179 L182 73 175 96 H145Z" fill="url(#gold)" stroke="#71411C" stroke-width="6" stroke-linejoin="round"/>
  <ellipse cx="130" cy="77" rx="10" ry="6" fill="#082F5D" stroke="#98F3FF" stroke-width="2.5"/>
  <ellipse cx="190" cy="77" rx="10" ry="6" fill="#082F5D" stroke="#98F3FF" stroke-width="2.5"/>
  <ellipse cx="160" cy="68" rx="14" ry="7" fill="#06436D" stroke="#82EBFF" stroke-width="3"/>
  <ellipse cx="160" cy="68" rx="6" ry="3" fill="#EDFFFF"/>

  <!-- Gold bands tie all barrels into one rotating mechanism. -->
  <path d="M117 117 H203 L208 137 H112Z" fill="url(#gold)" stroke="#78431C" stroke-width="5" stroke-linejoin="round"/>
  <path d="M119 123 H201" stroke="#FFF3B9" stroke-width="4" stroke-linecap="round"/>
  <path d="M131 150 H189 L197 173 180 197 H140 L123 173Z"
        fill="#115A9B" stroke="#092E5D" stroke-width="6" stroke-linejoin="round"/>
  <path d="M130 157 H190" stroke="url(#gold)" stroke-width="8" stroke-linecap="round"/>
  <path d="M140 175 H180" stroke="#69DBF4" stroke-width="5" stroke-linecap="round"/>

  <!-- Energetic diamond side vents. -->
  <path d="M123 165 104 172 106 190 132 197Z" fill="url(#gold)" stroke="#77411B" stroke-width="4" stroke-linejoin="round"/>
  <path d="M197 165 216 172 214 190 188 197Z" fill="url(#gold)" stroke="#77411B" stroke-width="4" stroke-linejoin="round"/>
  <path d="M110 179 122 172 124 189Z M210 179 198 172 196 189Z" fill="#67DDF7"/>

  <!-- Shared pivot (160,213), same as LV1 and LV2. -->
  <circle cx="160" cy="213" r="33" fill="#082B57" stroke="#071C3F" stroke-width="6"/>
  <circle cx="160" cy="213" r="28" fill="url(#gold)" stroke="#7B4518" stroke-width="3"/>
  <circle cx="160" cy="213" r="20" fill="#095A9B" stroke="#D2FBFF" stroke-width="3"/>
  <circle cx="160" cy="213" r="13" fill="#36C9E8" stroke="#AEFFFF" stroke-width="3"/>
  <path d="M160 202 169 213 160 224 151 213Z" fill="#E9FFFF" opacity=".8"/>
  <circle cx="160" cy="188" r="3" fill="#FFF4B8"/>
  <circle cx="160" cy="238" r="3" fill="#FFF4B8"/>
  <circle cx="135" cy="213" r="3" fill="#FFF4B8"/>
  <circle cx="185" cy="213" r="3" fill="#FFF4B8"/>
</svg>
